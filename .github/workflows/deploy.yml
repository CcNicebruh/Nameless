name: Deploy NamelessMC to GitHub Pages

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, mysql, gd, xml, curl, zip
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Create core config
        run: |
          cat > core/config.php << EOF
          <?php
          \$GLOBALS['config'] = array(
            'mysql' => array(
              'host' => '${{ secrets.DB_HOST }}',
              'port' => '3306',
              'username' => '${{ secrets.DB_USER }}',
              'password' => '${{ secrets.DB_PASS }}',
              'db' => '${{ secrets.DB_NAME }}',
              'prefix' => 'nl2_'
            ),
            'remember' => array(
              'cookie_name' => 'nl2',
              'cookie_expiry' => 604800
            ),
            'session' => array(
              'session_name' => 'user',
              'token_name' => 'token'
            ),
            'core' => array(
              'path' => '/',
              'friendly' => true,
              'force_https' => true,
              'force_www' => false,
              'installation' => false
            )
          );
          EOF

      - name: Process PHP files
        run: |
          mkdir build
          # Create .htaccess for build directory
          echo "RewriteEngine On" > build/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> build/.htaccess
          echo "RewriteRule ^(.*)$ index.html [L]" >> build/.htaccess
          
          # Process main PHP files
          for file in *.php; do
            if [ -f "$file" ]; then
              php "$file" > "build/${file%.php}.html" || true
            fi
          done
          
          # Copy static assets
          cp -r custom build/
          cp -r modules build/
          cp -r uploads build/
          cp -r core/assets build/core/
          
          # Remove PHP files from copied directories
          find build -name "*.php" -type f -delete
          
          # Create robots.txt
          echo "User-agent: *" > build/robots.txt
          echo "Allow: /" >> build/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
