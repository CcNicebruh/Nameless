name: Deploy PHP site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Build static site
        run: |
          # Create a build directory
          mkdir build
          # Loop through all PHP files and convert them to HTML
          find . -name "*.php" -type f -exec sh -c '
            for file do
              filename=$(basename "$file" .php)
              dirname=$(dirname "$file")
              mkdir -p "build/$dirname"
              php "$file" > "build/$dirname/$filename.html"
            done
          ' sh {} +
          # Copy all non-PHP files
          find . -type f ! -name "*.php" ! -path "./build/*" ! -path "./.git/*" -exec cp --parents {} build/ \;
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
